name: Monolith CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'monolith/**'
      - '.github/workflows/monolith-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'monolith/**'
      - '.github/workflows/monolith-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_test
      SECRET_KEY: "ci-secret-key-for-django-tests-only"
      DEBUG: "True"

    defaults:
      run:
        working-directory: monolith

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Django System & Settings
        run: uv run python manage.py check

      - name: Check Missing Migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Pytest
        run: uv run pytest
