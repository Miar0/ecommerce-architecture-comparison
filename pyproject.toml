[project]
name = "ecommerce-architecture-comparison"
version = "0.1.0"
description = "Comparative analysis of monolithic vs microservice architectures"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "**/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "DJ",
]
ignore = [
    "E203",
    "E501",
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["config", "apps", "products", "orders"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
